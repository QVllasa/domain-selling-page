# Dependabot: wöchentliche npm-Updates, Sicherheitsupdates gebündelt.
# NUR Patch-Updates werden per Workflow dependabot-auto-merge.yml automatisch
# gemergt. Minor- und Major-Updates bleiben als PR liegen und werden von Hand
# geprüft (Gründer-Entscheidung 23.09.2026, nach Prod-Ausfall durch einen
# auto-gemergten Minor-Bump von better-auth).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (Go-Compiler) wird von typescript-eslint noch nicht
      # unterstützt (Peer <6.1) — Lint/Build würden brechen. Wieder freigeben,
      # sobald typescript-eslint TS 7 unterstützt (Issue #10940).
      - dependency-name: "typescript"
        versions: [">=7"]
      # @types/node an die Node-Laufzeit koppeln (max. Node 22 in den Images).
      - dependency-name: "@types/node"
        versions: [">=23"]
    # Patch und Minor in GETRENNTEN Gruppen: Der Auto-Merge-Workflow mergt nur
    # Patch. Ein gemischter Sammel-PR hätte update-type = minor und bliebe liegen.
    groups:
      sicherheitsupdates-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["patch"]
      sicherheitsupdates-minor:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor"]
      versionsupdates-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch"]
      versionsupdates-minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor"]
