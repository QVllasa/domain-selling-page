# Ruft den zentralen Workflow aus QVllasa/workflows auf.
# Wenn der CI-Build auf einem Dependabot-Pull-Request fehlschlägt, repariert Claude
# den Build, committet auf den PR-Branch und kommentiert. Gemergt wird nie durch Claude.
name: Claude Dependabot-Fix
on:
  workflow_run:
    workflows: ["CI Build"]
    types: [completed]

concurrency:
  group: claude-dependabot-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  fix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.pull_requests[0] &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    uses: QVllasa/workflows/.github/workflows/claude-dependabot-fix.yml@main
    secrets: inherit
    with:
      package_manager: "npm"
      build_command: "npm run build"
      node_version: "22"
      extra_rules: ""
