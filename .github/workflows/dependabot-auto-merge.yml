# AKTUELLE REGEL (Gruenderentscheidung 25.09.2026): Patch UND Minor werden nach
# gruenem Build automatisch gemergt. Das loest die Einschraenkung "nur Patch" vom
# 23.09.2026 ab, die nach einem Prod-Ausfall durch einen auto-gemergten
# Minor-Bump von better-auth eingefuehrt worden war. Schutz bleibt die Sperrliste
# weiter unten plus der Build- und Test-Gate. Aeltere Kommentare in dieser Datei
# koennen dem widersprechen, diese Zeilen sind der Stand. Nicht ohne Ruecksprache
# mit dem Gruender aendern.
# Denylist: Pakete, die Datenbankschema oder Anmeldung besitzen, werden NIE automatisch
# gemergt, auch nicht als Patch. Grund: Solche Updates kompilieren sauber, verlangen aber
# oft eine Migration (Beispiel better-auth 1.7 mit neuer Spalte session.impersonatedBy).
# Ein gruener Build kann das nicht erkennen.
# Hinweis: GitHubs eingebautes Auto-Merge ist fuer private Repos im Free-Plan nicht
# verfuegbar (enablePullRequestAutoMerge wird abgelehnt). Deshalb mergt dieser Workflow
# direkt, nachdem der Build-Job gruen ist (needs: build).
# Dependabot Auto-Merge: NUR Patch-Updates werden nach grünem CI-Build
# automatisch per Squash gemergt. Minor- und Major-Updates werden NICHT gemergt
# und bleiben als PR zur manuellen Prüfung liegen (Gründer-Entscheidung
# 23.09.2026, nach Prod-Ausfall durch einen auto-gemergten Minor-Bump von
# better-auth). Damit gruppierte PRs nicht gemischt sind, trennt
# .github/dependabot.yml Patch- und Minor-Gruppen.
#
# Gate: Der Job auto-merge hängt per needs am Build-Job (ci-build.yml als
# wiederverwendbarer Workflow). Schlägt der Build fehl, läuft auto-merge nicht.
# Branch Protection ist auf privaten Repos im Free-Plan nicht verfügbar, deshalb
# ersetzt dieses needs-Gate den Pflicht-Status-Check.
name: Dependabot Auto-Merge
on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: ./.github/workflows/ci-build.yml
    with:
      called: true
    secrets: inherit
    permissions:
      contents: read

  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot-Metadaten lesen
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Sperrliste exakt pro Paketname pruefen. dependency-names ist ein
      # kommagetrennter String; contains() wuerde Teilstrings matchen ("pg"
      # blockierte so auch "@types/pg"). Hier wird jeder Name einzeln exakt
      # verglichen. Praefixregeln gelten nur fuer ganze Scopes (@better-auth/,
      # @prisma/, @payloadcms/, @supabase/), die vorher per Teilstring mit
      # abgedeckt waren.
      - name: Sperrliste exakt pruefen
        id: deny
        env:
          DEPS: ${{ steps.meta.outputs.dependency-names }}
        run: |
          set -euo pipefail
          exact="better-auth next-auth @auth/core drizzle-orm drizzle-kit prisma @prisma/client kysely typeorm sequelize mongoose pg mysql2 payload supabase"
          prefixes="@better-auth/ @prisma/ @payloadcms/ @supabase/"
          blocked=false
          hit=""
          IFS=',' read -ra names <<< "$DEPS"
          for raw in ${names[@]+"${names[@]}"}; do
            name="${raw#"${raw%%[![:space:]]*}"}"
            name="${name%"${name##*[![:space:]]}"}"
            [ -z "$name" ] && continue
            for d in $exact; do
              if [ "$name" = "$d" ]; then blocked=true; hit="$hit $name"; fi
            done
            for p in $prefixes; do
              case "$name" in "$p"*) blocked=true; hit="$hit $name" ;; esac
            done
          done
          if [ "$blocked" = true ]; then
            echo "::notice::Kein Auto-Merge, Paket auf der Sperrliste:$hit"
          fi
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"

      - name: Auto-Merge (Patch und Minor)
        if: |
          steps.deny.outputs.blocked != 'true' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Major-Update, manuelle Prüfung nötig
        if: |
          steps.meta.outputs.update-type != 'version-update:semver-patch' &&
          steps.meta.outputs.update-type != 'version-update:semver-minor'
        run: echo "::notice::Kein Auto-Merge (${{ steps.meta.outputs.update-type }}). Nur Patch- und Minor-Updates werden automatisch gemergt, bitte von Hand prüfen."
