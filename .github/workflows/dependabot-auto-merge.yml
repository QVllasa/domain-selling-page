# Denylist: Pakete, die Datenbankschema oder Anmeldung besitzen, werden NIE automatisch
# gemergt, auch nicht als Patch. Grund: Solche Updates kompilieren sauber, verlangen aber
# oft eine Migration (Beispiel better-auth 1.7 mit neuer Spalte session.impersonatedBy).
# Ein gruener Build kann das nicht erkennen.
# Hinweis: GitHubs eingebautes Auto-Merge ist fuer private Repos im Free-Plan nicht
# verfuegbar (enablePullRequestAutoMerge wird abgelehnt). Deshalb mergt dieser Workflow
# direkt, nachdem der Build-Job gruen ist (needs: build).
# Dependabot Auto-Merge: NUR Patch-Updates werden nach grünem CI-Build
# automatisch per Squash gemergt. Minor- und Major-Updates werden NICHT gemergt
# und bleiben als PR zur manuellen Prüfung liegen (Gründer-Entscheidung
# 23.09.2026, nach Prod-Ausfall durch einen auto-gemergten Minor-Bump von
# better-auth). Damit gruppierte PRs nicht gemischt sind, trennt
# .github/dependabot.yml Patch- und Minor-Gruppen.
#
# Gate: Der Job auto-merge hängt per needs am Build-Job (ci-build.yml als
# wiederverwendbarer Workflow). Schlägt der Build fehl, läuft auto-merge nicht.
# Branch Protection ist auf privaten Repos im Free-Plan nicht verfügbar, deshalb
# ersetzt dieses needs-Gate den Pflicht-Status-Check.
name: Dependabot Auto-Merge
on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: ./.github/workflows/ci-build.yml
    with:
      called: true
    secrets: inherit
    permissions:
      contents: read

  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot-Metadaten lesen
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-Merge (nur Patch)
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' &&
          !contains(steps.meta.outputs.dependency-names, 'better-auth') &&
          !contains(steps.meta.outputs.dependency-names, 'next-auth') &&
          !contains(steps.meta.outputs.dependency-names, '@auth/core') &&
          !contains(steps.meta.outputs.dependency-names, 'drizzle-orm') &&
          !contains(steps.meta.outputs.dependency-names, 'drizzle-kit') &&
          !contains(steps.meta.outputs.dependency-names, 'prisma') &&
          !contains(steps.meta.outputs.dependency-names, '@prisma/client') &&
          !contains(steps.meta.outputs.dependency-names, 'kysely') &&
          !contains(steps.meta.outputs.dependency-names, 'typeorm') &&
          !contains(steps.meta.outputs.dependency-names, 'sequelize') &&
          !contains(steps.meta.outputs.dependency-names, 'mongoose') &&
          !contains(steps.meta.outputs.dependency-names, 'pg') &&
          !contains(steps.meta.outputs.dependency-names, 'mysql2') &&
          !contains(steps.meta.outputs.dependency-names, '@better-auth/') &&
          !contains(steps.meta.outputs.dependency-names, 'payload') &&
          !contains(steps.meta.outputs.dependency-names, 'supabase')
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Minor-/Major-Update, manuelle Prüfung nötig
        if: steps.meta.outputs.update-type != 'version-update:semver-patch'
        run: echo "::notice::Kein Auto-Merge (${{ steps.meta.outputs.update-type }}). Nur Patch-Updates werden automatisch gemergt, bitte von Hand prüfen."
